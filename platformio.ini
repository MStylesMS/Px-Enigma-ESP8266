; px-enigma-esp8266 — PlatformIO project configuration

[platformio]
default_envs = nodemcuv2

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino

monitor_speed = 115200
upload_speed = 115200

board_build.filesystem = littlefs

; Adafruit_LEDBackpack pulls in transitive headers (e.g. SPI) via Adafruit_BusIO
; even on I2C-only builds. deep+ ensures the library dependency finder resolves
; nested includes correctly.
lib_ldf_mode = deep+

build_flags =
    -D MQTT_MAX_PACKET_SIZE=1024
    -D MQTT_KEEPALIVE=30
    -D FW_VERSION=\"0.1.0-dev\"
    -D ATOMIC_FS_UPDATE
    -D BEARSSL_SSL_BASIC

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    knolleary/PubSubClient @ ^2.8
    adafruit/Adafruit LED Backpack Library @ ^1.4.0
    adafruit/Adafruit GFX Library @ ^1.11.0
    SPI
    ; ESP8266mDNS, ESP8266WebServer, ESP8266HTTPUpdateServer, ArduinoOTA,
    ; LittleFS, ESP8266WiFi, ESP8266WiFiMulti are bundled with the platform core.

[env:native]
platform = native
test_framework = unity
test_build_src = false

build_flags =
    -D ARDUINOJSON_ENABLE_STD_STRING=1
    -D FW_VERSION=\"host-test\"
    -I test/stubs

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
